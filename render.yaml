services:
  - type: web
    name: dsa-pattern
    runtime: python
    plan: starter
    region: oregon
    rootDir: backend
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /dashboard
    disk:
      name: dsa-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DSA_DB_PATH
        value: /data/dsa.db
      - key: PYTHONUNBUFFERED
        value: "1"
